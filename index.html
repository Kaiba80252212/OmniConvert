<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Convert images, audio and video between 19 formats entirely in your browser. No uploads, no accounts, no watermarks."
    />
    <meta name="theme-color" content="#0a0a0c" />
    <title>OmniConvert — Convert any media, privately</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes.
      try {
        var stored = localStorage.getItem('omniconvert-theme')
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0a0a0c' : '#e7e7ea')
      } catch (error) {
        /* storage unavailable: keep the dark default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
